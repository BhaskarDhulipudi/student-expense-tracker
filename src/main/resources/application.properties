spring.application.name=student-expense-tracker

# Private single-user config
# Default private password for personal use. Change later in Render or your hosting environment.
app.password=${APP_PASSWORD:123456}

# Database
# Local default: H2 in-memory database so the app can start without extra setup.
# Override with DB_URL for MySQL/PostgreSQL in local or cloud environments.
spring.datasource.url=${DB_URL:jdbc:h2:mem:student_expenses;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

server.port=${PORT:8080}
server.tomcat.connection-timeout=30000
server.error.include-stacktrace=never