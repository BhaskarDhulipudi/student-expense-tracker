spring.application.name=student-expense-tracker

# Local development defaults to MySQL. On Render, DATABASE_URL is supplied by Render Postgres.
spring.datasource.url=jdbc:${DATABASE_URL:mysql://localhost:3306/student_expenses?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.port=${PORT:8080}
