services:
  - type: web
    name: student-expense-tracker
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: DB_DRIVER
        value: postgresql

      - key: DB_HOST
        fromDatabase:
          name: student-expenses-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: student-expenses-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: student-expenses-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: student-expenses-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: student-expenses-db
          property: password

databases:
  - name: student-expenses-db
    plan: free
    region: singapore
    databaseName: student_expenses
    user: student_expenses_user